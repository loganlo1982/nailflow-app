# Codemagic (codemagic.io) – builds in the cloud on a Mac (no Mac needed). Free: 500 Mac minutes / month.
workflows:
  ios-testflight:
    name: iPhone → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NailFlow   # Codemagic → Team settings → Integrations → App Store Connect → key name "NailFlow"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nailflow.salonmanager
      # groups: [firebase]        # add later: variable GOOGLE_SERVICE_INFO_PLIST = the text of GoogleService-Info.plist
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: npm install
      - name: Firebase file
        script: if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist; fi
      - name: iOS project
        script: |
          npx cap add ios || echo "CocoaPods run again after the patch below"
          node scripts/patch-native.js ios
          npm run assets
          npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: cd ios/App && agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-apk:
    name: Android → test .apk
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      # groups: [firebase]        # add later: variable GOOGLE_SERVICES_JSON = the text of google-services.json
      node: 22
      java: 21
    scripts:
      - npm install
      - if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi
      - npm run add:android && npm run assets && npx cap sync android
      - cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
