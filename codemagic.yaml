# Codemagic (codemagic.io) – builds in the cloud on a Mac (no Mac needed). Free: 500 Mac minutes / month.
workflows:
  ios-testflight:
    name: iPhone → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NailFlow   # Codemagic → Team settings → Integrations → App Store Connect → key name "NailFlow"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nailflow.salonmanager
      groups: [firebase]          # Codemagic → Team settings → Environment variables → group "firebase": GOOGLE_SERVICE_INFO_PLIST, GOOGLE_SERVICES_JSON (file text or base64)
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: npm install
      - name: Firebase file
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            case "$GOOGLE_SERVICE_INFO_PLIST" in "<"*) printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist ;; *) printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist ;; esac
          else
            # Without the Firebase file the push plugin crashes the app at launch – leave it out until Firebase is set up
            npm uninstall @capacitor-firebase/messaging
          fi
      - name: iOS project
        script: |
          npx cap add ios || echo "CocoaPods run again after the patch below"
          node scripts/patch-native.js ios
          npm run assets
          npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: cd ios/App && agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # internal testers only; no external beta review needed
  android-apk:
    name: Android → test .apk
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      groups: [firebase]
      node: 22
      java: 21
    scripts:
      - npm install
      - |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          case "$GOOGLE_SERVICES_JSON" in "{"*) printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json ;; *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json ;; esac
        fi
      - npm run add:android && npm run assets && npx cap sync android
      - cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
