<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Luật chia turn – Xem thử</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--sub:#55555A;--line:#E0E0E6;--blue:#2F6FB5;--blueSoft:#E6EEF8;--green:#1E7B37;--greenSoft:#E3F1E6;--amber:#7A4F00;--amberSoft:#FFF1CF;--red:#C62828;--sel:#EEF4FC}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#F2F2F7;--sub:#AEAEB2;--line:#38383A;--blue:#6AA6EE;--blueSoft:#1A2A40;--green:#6FD08C;--greenSoft:#16301F;--amber:#F5C36B;--amberSoft:#3A2C0D;--red:#FF8A80;--sel:#18263A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
.banner{position:sticky;top:0;z-index:20;background:#FFE7A8;color:#5A2A00;border-bottom:2px solid #E8B64A;text-align:center;font-weight:800;font-size:17px;line-height:1.3;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
@media (prefers-color-scheme:dark){.banner{background:#3B2C07;color:#FFD86B;border-color:#7A5A12}}
main{max-width:640px;margin:0 auto;padding:8px 16px calc(130px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:12px 0 4px}
h1{font-size:24px;line-height:1.25;margin:0}
h2{font-size:21px;margin:26px 0 8px}
.lang{margin-left:auto;flex:none;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:0 16px;font:inherit;font-size:17px;font-weight:600}
.sub{color:var(--sub);font-size:17px;margin:6px 0}
.three{background:var(--blueSoft);border-radius:12px;padding:10px 12px;font-size:17px;margin:10px 0}
.q{background:var(--card);border-radius:14px;padding:14px 14px 12px;margin:12px 0}
.q h3{font-size:20px;line-height:1.3;margin:0 0 6px}
.q h3 .no{color:var(--blue);margin-right:6px}
.line1{font-size:17px;color:var(--ink);background:var(--amberSoft);border-radius:10px;padding:8px 10px;margin:6px 0 8px}
label.o{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:10px 8px;margin:8px 0 0;border:1px solid var(--line);border-radius:12px;cursor:pointer}
label.o.on{border-color:var(--blue);background:var(--sel)}
label.o input[type=radio],label.o input[type=checkbox]{margin:2px 0 0;width:26px;height:26px;flex:none;accent-color:var(--blue)}
label.o .t{font-size:18px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.tag{font-size:17px;font-weight:600;border-radius:8px;padding:0 8px;line-height:1.5}
.pop{background:var(--greenSoft);color:var(--green)}.later{background:var(--amberSoft);color:var(--amber)}.built{background:var(--blueSoft);color:var(--blue)}
.ex{display:block;color:var(--sub);font-size:17px;line-height:1.4;margin-top:4px}
input.n,select,textarea{font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input.n{width:96px;min-height:44px;display:inline-block;margin:2px 4px}
select{min-height:48px;width:100%}
textarea{width:100%;min-height:52px;margin-top:10px;display:block}
.f{margin:12px 0 0}.f>span{display:block;font-size:17px;color:var(--sub);margin-bottom:4px}
.btn{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:12px;min-height:52px;padding:10px 14px;background:var(--blue);color:#fff;width:100%;cursor:pointer}
.btn.alt{background:var(--card);color:var(--blue);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .fi{max-width:640px;margin:0 auto;display:grid;grid-template-columns:3fr 2fr;gap:8px}
.foot .btn.save{background:var(--green)}
/* simulator */
.sim{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.clock{font-weight:700;font-size:18px}
.lab{font-size:17px;font-weight:700;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;border:2px solid var(--line);border-radius:20px;padding:2px 12px 2px 4px;font-size:17px;font-weight:700;background:var(--card)}
.chip b{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--blueSoft);color:var(--blue)}
.chip.mv{border-color:var(--blue)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
.row>span{font-weight:700;font-size:17px}
.arrow{margin:2px 0 2px 64px;color:var(--blue);font-weight:700;font-size:17px}
.cnt{background:var(--greenSoft);border-radius:10px;padding:8px 10px;font-size:17px;margin:8px 0 0}
.tim{background:var(--amberSoft);border-radius:10px;padding:8px 10px;font-size:17px;margin:8px 0 0}
.cnt b{color:var(--green)}.tim b{color:var(--amber)}
.ev{border:2px solid var(--blue);border-radius:12px;padding:10px 12px;margin:12px 0 0}
.ev p{margin:0 0 6px;font-size:17px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.acts .btn{font-size:17px;min-height:52px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.acts .wide{grid-column:1/-1}
.note{font-size:17px;color:var(--amber);margin:8px 0 0}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#sheet>div{background:var(--card);border-radius:16px 16px 0 0;max-width:640px;width:100%;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet h2{margin:0 0 8px}
#sheet ul{padding-left:22px;margin:8px 0}#sheet li{margin:6px 0;font-size:17px}
#sheet .btn{margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#111827;color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.toast.show{opacity:1}
:focus-visible{outline:3px solid #7FB0E8;outline-offset:2px}

.tg{min-height:48px;border:2px solid var(--line);border-radius:24px;padding:6px 16px;font:inherit;font-size:17px;font-weight:600;background:var(--card);color:var(--ink);cursor:pointer}
.tg.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chipq{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.tx{font:inherit;font-size:18px;width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.subn{border-left:4px solid var(--blueSoft);padding-left:10px;margin:8px 0 0}
.err{color:var(--red);font-size:17px;font-weight:700}.err:empty{display:none}
.lh{font-size:19px;margin:16px 0 4px}
details.nf{margin:14px 0 0;border:1px solid var(--line);border-radius:12px}
details.nf>summary{min-height:52px;display:flex;align-items:center;padding:0 14px;font-weight:700;color:var(--blue);cursor:pointer;font-size:18px}
details.nf pre{margin:0;padding:10px 14px;font-size:17px;line-height:1.4;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace}
[hidden]{display:none!important}
.tblw{margin:10px 0 12px}.tblt{font-weight:600;margin:0 0 6px}.tbl{width:100%;border-collapse:collapse;font-size:17px}.tbl th,.tbl td{border:1px solid var(--line,#d0d5dd);padding:8px 6px;text-align:left;vertical-align:top}.tbl thead th{background:var(--sel);font-weight:600}.tbl tbody th{font-weight:500}.tbl .hl{background:var(--sel);font-weight:700;color:var(--blue)}.tblnow{margin-top:6px;font-weight:600;color:var(--blue)}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<main id="app"></main>
<div class="foot"><div class="fi"><button type="button" class="btn save" id="bSave"></button><button type="button" class="btn alt" id="bReset"></button></div></div>
<div id="sheet"><div id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

 { t: V('Ai nhận khách walk-in', 'Who gets the walk-in'), qs: [

 ] },
 { t: V('Khách gọi tên thợ và khách hẹn', 'Requests and appointments'), qs: [
