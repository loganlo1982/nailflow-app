<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2F7">
<title>Chọn cách chia khách cho thợ – Xem thử</title>
<style>
:root{--bar:#E8F0FB;--bg:#F2F2F7;--card:#fff;--ink:#111418;--muted:#4B5563;--line:#E3E5E8;--blue:#2563EB;--green:#1E8E3E;--red:#C62828;--amber:#B45309;--soft:#EEF4FF;--note:#F8FAFC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.banner{position:sticky;top:0;z-index:20;background:#FEF3C7;color:#7C2D12;border-bottom:1px solid #FCD34D;text-align:center;font-weight:800;font-size:14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
header{padding:18px 0 4px}
h1{margin:0;font-size:28px;line-height:1.2;font-weight:800}
.lead{margin:8px 0 0;font-size:18px}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;margin:12px 0 0;padding:4px;border-radius:14px;background:#E5E7EB}
.lang button{min-height:44px;min-width:120px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:16px;font-weight:700;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.words{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.words b.h{display:block;font-size:17px;margin-bottom:4px}
.words dl{margin:0}.words dt{font-weight:700;margin-top:6px}.words dd{margin:0;color:var(--muted);font-size:16px}
.sample{margin:14px 0 0;display:grid;gap:6px}
.sample small{color:var(--muted);font-size:15px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:16px 0 0;overflow:hidden}
.sec>h2{margin:0;padding:14px;background:var(--bar);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.3}
.sec .in{padding:4px 14px 14px}
.q{font-weight:800;font-size:18px;margin:14px 0 4px}
.qn{color:var(--muted);font-size:15px;margin:0 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-of-type{border-bottom:0}
.opt input{flex:0 0 26px;width:26px;height:26px;margin:1px 0 0;accent-color:var(--blue)}
.opt b{display:block;font-size:18px;font-weight:700}
.opt span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.ex{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:16px}
.ex b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--blue);margin-bottom:2px}
.now{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#ECFDF5;color:#065F46;font-size:16px;font-weight:600}
.na{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--note);border:1px dashed #CBD2DE;color:var(--muted);font-size:15px}
.must{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#FFF7ED;border:1px solid #FDBA74;font-size:15px}
.num{display:flex;align-items:center;gap:10px;margin:6px 0}
.num button{flex:0 0 52px;height:52px;border-radius:12px;border:1px solid #CBD2DE;background:#fff;font-size:26px;font-weight:700;color:var(--blue);cursor:pointer}
.num output{flex:1;text-align:center;font-size:22px;font-weight:800}
details.more{margin:12px 0 0}
details.more>summary{min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--blue);cursor:pointer;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";display:inline-block;width:20px;transition:transform .2s}
details.more[open]>summary::before{transform:rotate(90deg)}
.adv>summary{padding:14px;background:var(--bar);font-size:17px;font-weight:800;text-transform:uppercase;color:var(--ink)}
.adv .in{padding:4px 14px 14px}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#E5E7EB;color:#374151;font-size:12px;font-weight:700;vertical-align:middle}
.sum{margin:16px 0 0;padding:14px 16px;border:2px solid #2F9E74;border-radius:14px;background:rgba(47,158,116,.08)}
.sum b{display:block;font-size:19px;margin-bottom:6px}
.sum p{margin:6px 0;font-size:17px}
/* try it */
.queue{display:grid;gap:8px;margin:10px 0 0}
.tq{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff}
.tq.next{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,142,62,.18)}
.tq .pos{font-size:20px;font-weight:800;text-align:center;color:var(--muted)}
.tq .nm{font-weight:800;font-size:19px}
.tq .st{font-size:13px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;background:#E5E7EB;color:#374151}
.st.free{background:#DCFCE7;color:#166534}.st.busy{background:#DBEAFE;color:#1E40AF}.st.brk{background:#FEF3C7;color:#92400E}.st.out{background:#F3F4F6;color:#6B7280}.st.pen{background:#FEE2E2;color:#991B1B}
.tq .stats{font-size:14px;color:var(--muted);margin-top:2px}
.tq .acts{display:grid;gap:6px}
.btn{min-height:44px;border-radius:12px;border:1px solid #CBD2DE;background:#fff;font:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;padding:6px 10px}
.btn:disabled{opacity:.35}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{color:var(--red);border-color:rgba(198,40,40,.4)}
.btn.blk{width:100%;min-height:52px;font-size:17px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts2 .wide{grid-column:1/-1}
.nextline{margin:12px 0 0;padding:12px;border-radius:12px;background:#ECFDF5;color:#065F46;font-weight:700}
.log{margin:10px 0 0;padding:0;list-style:none;max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.log li{padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px}
.log li b{display:block;font-size:16px}
.log li small{display:block;color:var(--muted)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .fi{max-width:640px;margin:0 auto;display:grid;grid-template-columns:3fr 2fr;gap:8px}
.foot .btn{min-height:52px;font-size:17px}
.foot small{grid-column:1/-1;text-align:center;color:var(--amber);font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#111827;color:#fff;font-weight:700;padding:12px 18px;border-radius:999px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .box{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:21px}
.choices{display:grid;gap:8px;margin:10px 0}
@media (prefers-color-scheme:dark){
 :root{--bar:#1E2A44;--bg:#0F141E;--card:#1A2132;--ink:#E6EAF2;--muted:#A3ACBD;--line:#2C3546;--soft:#1E2A44;--note:#141B29}
 .btn,.num button,.tq{background:#1A2132;color:var(--ink);border-color:#3F4D64}
 .btn.pri{background:var(--blue);color:#fff}.btn.grn{background:var(--green);color:#fff}
 .foot{background:rgba(26,33,50,.97)}.sheet .box{background:#1A2132}
 .now,.nextline{background:#0B3B2A;color:#A7F3D0}
 .banner{background:#3B2A08;color:#FCD34D;border-color:#7C5A10}
 .must{background:#2A1D0E;border-color:#7C5A10}
 .lang{background:#0F141E}.tag,.tq .st{background:#2C3546;color:#D1D5DB}
}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="wrap">
<header>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="vi">Tiếng Việt</button><button type="button" data-lang="en">English</button></div>
</header>
<div class="words" id="words"></div>
<div class="sample"><button type="button" class="btn pri blk" id="bSample"></button><small id="sampleNote"></small></div>
<div id="parts"></div>
<details class="sec adv" id="adv"><summary id="advT"></summary><div class="in" id="advBody"></div></details>
<div class="sum" id="sum"></div>
<section class="sec" id="try"><h2 id="tryT"></h2><div class="in" id="tryBody"></div></section>
<div style="height:16px"></div>
</div>
<div class="foot"><div class="fi">
  <button type="button" class="btn grn" id="bSave"></button>
  <button type="button" class="btn" id="bReset"></button>
  <small id="saveNote"></small>
</div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<script>
(function () {
'use strict';
var KEY = 'nf_turn_rules_preview_v3', LKEY = 'nf_turn_rules_preview_lang';
var LANG = 'vi'; try { if (localStorage.getItem(LKEY) === 'en') LANG = 'en'; } catch (e) {}
function L(vi, en) { return LANG === 'en' ? en : vi; }
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function fmt(n) { n = Math.round(n * 10) / 10; return LANG === 'vi' ? String(n).replace('.', ',') : String(n); }
function toast(t) { var x = $('#toast'); x.textContent = t; x.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(function () { x.classList.remove('show'); }, 2000); }

var TECHS = ['Lan', 'Mai', 'Nhân', 'Dân'];
var SVC = [
  { id: 'mani', vi: 'Làm tay (manicure)', en: 'Manicure', price: 25, min: 30 },
  { id: 'pedi', vi: 'Làm chân (pedicure)', en: 'Pedicure', price: 40, min: 45 },
  { id: 'full', vi: 'Bộ bột mới (full set)', en: 'Full set', price: 55, min: 60 },
  { id: 'combo', vi: 'Tay + chân (1 thợ)', en: 'Mani + Pedi (one tech)', price: 65, min: 75, combo: true },
  { id: 'polish', vi: 'Sơn lại', en: 'Polish change', price: 15, min: 15 },
  { id: 'repair', vi: 'Sửa 1 móng (có thu tiền)', en: 'Fix one nail (paid)', price: 10, min: 15 }
];
function sname(s) { return L(s.vi, s.en); }
/* the choices – blank page = the sample values */
var SAMPLE = { method: 'line', dollarScope: 'all', reqW: '0', reqPos: 'keep', apptW: '1', hold: '15', smallUnder: 20, smallW: '0.5', combo: 'one', twoTech: 'half',
  breakBack: 'keep', late: 'end', refuse: 'end', queues: 'one', whoMoves: 'owner', reason: 'yes', startDay: 'clock', tie: 'clock', bigOver: 50 };
var cfg = load();
function load() { try { var o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) { var c = copy(SAMPLE); for (var k in o) if (k in c) c[k] = o[k]; return c; } } catch (e) {} return copy(SAMPLE); }
var isLine = function () { return cfg.method === 'line'; }, isManual = function () { return cfg.method === 'manual'; };
var MAIN = ['line', 'dollar', 'manual'], OTHER = ['count', 'time', 'points'];
function wText(w) { w = String(w); return w === '0' ? L('không cộng lượt', 'adds no turn') : w === '0.5' ? L('cộng nửa lượt', 'adds half a turn') : L('cộng một lượt', 'adds one turn'); }
function mName(m) { return { line: L('Lần lượt theo hàng', 'Take turns in line'), dollar: L('Ưu tiên thợ có ít tiền dịch vụ hơn', 'Lowest service money first'), manual: L('Chủ tiệm / lễ tân tự chọn thợ', 'Owner / front desk picks'), count: L('Ưu tiên thợ làm ít khách hơn', 'Fewest customers first'), time: L('Ưu tiên thợ có ít phút làm hơn', 'Fewest service minutes first'), points: L('Ưu tiên thợ có ít điểm hơn', 'Fewest points first') }[m]; }

/* ---------- building blocks ---------- */
function opt(name, val, title, note) { return '<label class="opt"><input type="radio" name="' + name + '" value="' + val + '"' + (String(cfg[name]) === String(val) ? ' checked' : '') + '><div><b>' + esc(title) + '</b>' + (note ? '<span>' + esc(note) + '</span>' : '') + '</div></label>'; }
function q(t, n) { return '<div class="q">' + esc(t) + '</div>' + (n ? '<div class="qn">' + esc(n) + '</div>' : ''); }
function ex(t) { return '<div class="ex"><b>' + esc(L('Ví dụ', 'Example')) + '</b>' + esc(t) + '</div>'; }
function now(t) { return '<div class="now">' + esc(L('Với lựa chọn hiện tại, hệ thống sẽ ', 'With the current choice, the system will ')) + esc(t) + '</div>'; }
function na(t) { return '<div class="na">' + esc(t) + '</div>'; }
function sec(n, t, body) { return '<section class="sec"><h2>' + esc(L('Phần ', 'Part ') + n + ' — ' + t) + '</h2><div class="in">' + body + '</div></section>'; }
function num(k, min, max, step) { return '<div class="num"><button type="button" data-dn="' + k + '" data-step="' + (-step) + '" data-min="' + min + '" data-max="' + max + '" aria-label="' + esc(L('Bớt', 'Less')) + '">−</button><output>$' + cfg[k] + '</output><button type="button" data-dn="' + k + '" data-step="' + step + '" data-min="' + min + '" data-max="' + max + '" aria-label="' + esc(L('Thêm', 'More')) + '">+</button></div>'; }
var POS_ONLY_LINE = function () { return na(L('Cách chia đang chọn không dùng vị trí trong hàng, nên phần vị trí không hiện.', 'The chosen way does not use places in line, so the place question is hidden.')); };

/* ---------- the 7 parts ---------- */
function part1() {
  var b = q(L('Khách không hẹn tiếp theo giao cho ai?', 'Who gets the next walk-in customer?'));
  b += opt('method', 'line', L('A. Lần lượt theo hàng', 'A. Take turns in line'), L('Thợ đứng đầu hàng mà đang rảnh được đề nghị nhận khách. Nhận khách có cộng lượt thì thợ xuống cuối hàng. Không cộng lượt thì giữ vị trí. Nửa lượt: giữ vị trí, đủ hai lần nửa lượt thì xuống cuối hàng.', 'The first free tech in line is offered the customer. A customer that adds a turn sends the tech to the end of the line. No turn = keeps the place. Half a turn: keeps the place; after two halves the tech goes to the end.'));
  b += opt('method', 'dollar', L('B. Ưu tiên thợ có ít tiền dịch vụ hơn trong ngày', 'B. The tech with less service money today first'), L('Tiền so sánh = giá dịch vụ trên phiếu, chưa trừ giảm giá, không gồm tip, không gồm thuế.', 'Money compared = the service price on the ticket, before discounts, no tip, no tax.'));
  b += opt('method', 'manual', L('C. Chủ tiệm hoặc lễ tân tự chọn thợ', 'C. The owner or front desk picks the tech'), L('Hệ thống chỉ hiển thị số lượt, tiền và ai đang rảnh để hỗ trợ chia khách.', 'The system only shows turns, money and who is free to help.'));
  var other = OTHER.indexOf(cfg.method) >= 0;
  b += '<details class="more"' + (other ? ' open' : '') + '><summary>' + esc(L('Xem các cách chia khác', 'See other ways')) + '</summary>'
    + opt('method', 'count', L('Ưu tiên thợ làm ít khách hơn', 'Fewest customers first'), L('Đếm số khách thợ đã làm hôm nay (mỗi khách là 1, không xét nửa lượt). Sửa móng miễn phí không đếm.', 'Counts customers served today (each customer = 1, no halves). Free fixes do not count.'))
    + opt('method', 'time', L('Ưu tiên thợ có ít phút làm hơn', 'Fewest service minutes first'), L('Cộng số phút của các dịch vụ thợ đã làm hôm nay.', 'Adds up the minutes of the services done today.'))
    + opt('method', 'points', L('Ưu tiên thợ có ít điểm hơn', 'Fewest points first'), L('Dịch vụ nhỏ = ½ điểm, dịch vụ thường = 1 điểm, dịch vụ lớn = 1½ điểm (mức tiền chỉnh ở Cài đặt thêm).', 'Small service = ½ point, normal = 1, big = 1½ (the $ line is in More settings).'))
    + '</details>';
  if (cfg.method === 'dollar') {
    b += q(L('Tiền của khách nào được tính để so sánh?', 'Whose money is compared?'));
    b += opt('dollarScope', 'all', L('Mọi khách thợ đã làm', 'Every customer the tech did'), L('Gồm cả khách yêu cầu thợ và khách hẹn.', 'Includes requested and booked customers.'));
    b += opt('dollarScope', 'walk', L('Chỉ khách không hẹn', 'Walk-ins only'), L('Khách yêu cầu thợ và khách hẹn không cộng vào tiền so sánh.', 'Requested and booked customers are not added.'));
  }
  if (isLine()) b += ex(L('Hàng: Lan → Mai → Nhân → Dân. Lan nhận bộ bột $55 (cộng một lượt) → hàng thành Mai → Nhân → Dân → Lan.', 'Line: Lan → Mai → Nhân → Dân. Lan takes a $55 full set (one turn) → the line becomes Mai → Nhân → Dân → Lan.'));
  else if (cfg.method === 'dollar') b += ex(L('Lan $80, Mai $40, cả hai đang rảnh → Mai được đề nghị nhận khách. Bằng tiền nhau thì theo cách ở Cài đặt thêm.', 'Lan $80, Mai $40, both free → Mai is offered the customer. Same money → see More settings.'));
  else if (isManual()) b += ex(L('Khách tới, lễ tân thấy Mai rảnh và có 1 lượt, Lan có 2 lượt → lễ tân tự bấm chọn Mai.', 'A customer comes; the desk sees Mai is free with 1 turn, Lan has 2 → the desk picks Mai.'));
  else if (cfg.method === 'count') b += ex(L('Lan đã làm 3 khách, Nhân 2 khách → Nhân được đề nghị.', 'Lan has 3 customers, Nhân 2 → Nhân is offered.'));
  else if (cfg.method === 'time') b += ex(L('Lan đã làm 90 phút, Dân 45 phút → Dân được đề nghị.', 'Lan 90 minutes, Dân 45 → Dân is offered.'));
  else b += ex(L('Lan 2 điểm, Mai 1½ điểm → Mai được đề nghị.', 'Lan 2 points, Mai 1½ → Mai is offered.'));
  b += now(isLine() ? L('đề nghị thợ rảnh đứng đầu hàng; thợ đang bận được bỏ qua nhưng giữ vị trí.', 'offer the first free tech in line; busy techs are skipped but keep their place.')
    : isManual() ? L('không tự chia; chủ tiệm hoặc lễ tân chọn thợ cho từng khách.', 'not pick anyone; the owner or desk picks for each customer.')
    : L('đề nghị thợ rảnh có ', 'offer the free tech with ') + { dollar: L('ít tiền dịch vụ nhất', 'the least service money'), count: L('ít khách nhất', 'the fewest customers'), time: L('ít phút làm nhất', 'the fewest minutes'), points: L('ít điểm nhất', 'the fewest points') }[cfg.method] + (cfg.method === 'dollar' ? L(' (', ' (') + (cfg.dollarScope === 'all' ? L('tính mọi khách', 'all customers') : L('chỉ khách không hẹn', 'walk-ins only')) + ').' : '.'));
  return sec(1, L('Khách không hẹn tiếp theo giao cho ai?', 'Who gets the next walk-in?'), b);
}
function usesTurns() { return isLine() || isManual(); }
function part2() {
  var b = '';
  if (usesTurns()) {
    b += q(L('Khách yêu cầu đúng tên thợ có tính lượt không?', 'Does a customer who asks for a tech by name add a turn?'));
    b += opt('reqW', '0', L('Không cộng lượt', 'No turn'), L('Số lượt của thợ không đổi.', 'The tech\'s turns do not change.'));
    b += opt('reqW', '0.5', L('Cộng nửa lượt', 'Half a turn'), L('Cộng 0,5 vào số lượt của thợ.', 'Adds 0.5 to the tech\'s turns.'));
    b += opt('reqW', '1', L('Cộng một lượt', 'One turn'), L('Tính như một khách bình thường.', 'Counts like a normal customer.'));

/* ---------- the engine (preview only) ---------- */

function T(n) { return sim.t.filter(function (x) { return x.name === n; })[0]; }

}
function ptsOf(s) { return small(s) ? 0.5 : s.price >= +cfg.bigOver ? 1.5 : 1; }

  if (isLine()) return sim.line.map(T).filter(function (t) { return c.indexOf(t) >= 0; });
  if (isManual()) return c;
  var lp = function (t) { var i = sim.line.indexOf(t.name); return i < 0 ? 99 : i; };
  return c.sort(function (a, b) { if (a.pen !== b.pen) return a.pen ? 1 : -1; var d = metric(a) - metric(b); if (Math.abs(d) > 1e-9) return d; return cfg.tie === 'line' ? lp(a) - lp(b) : a.ord - b.ord; });
}
function nextTech(skip) { return isManual() ? null : (ranked(skip)[0] || null); }
/* one tech gets one customer; share = 1 or 0.5 (two techs); returns the record */
function apply(t, s, kind, share, w) {

  var cm = cfg.method !== 'dollar' || cfg.dollarScope === 'all' || kind === 'walk' || kind === 'two';
  var money = kind === 'freefix' ? 0 : s.price * share; if (cm) t.money += money;

  var pendAdd = 0;
  if (isLine()) {

    else if (w >= 1) { toEnd(t); moved = 'end'; }
    else if (w === 0.5) { t.pend += 0.5; pendAdd = 0.5; if (t.pend >= 1) { t.pend -= 1; toEnd(t); moved = 'end'; pendAdd = -0.5; } }
  } else if (sim.line.indexOf(t.name) >= 0) toEnd(t);
  t.busy = s; var r = { id: ++sim.seq, t: t.name, s: s, kind: kind, w: w, money: cm ? money : 0, pts: pts, min: Math.round(s.min * (share < 1 ? 0.5 : 1)), cust: kind === 'freefix' ? 0 : 1, pendAdd: pendAdd, done: false };

}
function kindName(k) { return { walk: L('khách không hẹn', 'walk-in'), req: L('khách yêu cầu', 'requested'), appt: L('khách hẹn', 'booked'), two: L('hai thợ chia', 'two techs'), freefix: L('sửa miễn phí', 'free fix') }[k]; }

function walkIn(s) {

  var t = nextTech(); if (!t) { sim.log.unshift({ b: L('Khách chờ', 'Customer waits'), m: L('không có thợ nào đang rảnh – không giao chồng khách cho thợ bận', 'nobody is free – a busy tech never gets two customers') }); draw(); return; }

  var d = e.target.closest('[data-dn]'); if (d) { var k = d.dataset.dn; cfg[k] = Math.max(+d.dataset.min, Math.min(+d.dataset.max, +cfg[k] + +d.dataset.step)); var y = window.scrollY; draw(); window.scrollTo(0, y); return; }
  var a = e.target.closest('[data-a]'); if (a) { act(a.dataset.a); return; }
  var dn = e.target.closest('[data-done]'); if (dn) { var t = T(dn.dataset.done); sim.recs.forEach(function (r) { if (r.t === t.name && r.s === t.busy) r.done = true; }); t.busy = null; sim.log.unshift({ b: t.name + L(' làm xong', ' finished'), m: L('rảnh lại', 'free again') + (isLine() ? ' · ' + L('hàng: ', 'line: ') + lineStr() : '') }); draw(); return; }
  var bk = e.target.closest('[data-brk]'); if (bk) { var t2 = T(bk.dataset.brk); t2.brk = !t2.brk; var before = lineStr(); if (!t2.brk && cfg.breakBack === 'end') { if (isLine()) toEnd(t2); else t2.pen = true; }
    sim.log.unshift({ b: t2.name + (t2.brk ? L(' đi nghỉ', ' takes a break') : L(' nghỉ xong quay lại', ' is back from the break')), m: t2.brk ? L('không được giao khách khi đang nghỉ; vị trí giữ nguyên', 'gets no customers while on break; place kept') : (cfg.breakBack === 'keep' ? L('giữ vị trí', 'keeps the place') : L('xuống cuối hàng', 'goes to the end')) + (isLine() ? ' · ' + L('trước: ', 'before: ') + before + L(' · sau: ', ' · after: ') + lineStr() : '') }); draw(); return; }
  var ci = e.target.closest('[data-in]'); if (ci) { var t3 = T(ci.dataset.in); t3.on = true; sim.line.push(t3.name);
    if (!isLine() && !isManual() && cfg.late === 'avg') { var others = sim.t.filter(function (x) { return x !== t3 && x.on; }); var av = function (f) { return others.reduce(function (s, x) { return s + x[f]; }, 0) / Math.max(1, others.length); }; t3.money = av('money'); t3.cust = Math.round(av('cust')); t3.min = Math.round(av('min')); t3.pts = av('pts'); }
    sim.log.unshift({ b: t3.name + L(' bấm vào ca', ' starts the shift'), m: isLine() ? L('xếp cuối hàng hiện tại · hàng: ', 'placed at the end · line: ') + lineStr() : (cfg.late === 'avg' ? L('bắt đầu ở mức trung bình', 'starts at the average') : L('bắt đầu từ 0', 'starts from 0')) }); draw(); return; }
});
$('#bSample').addEventListener('click', function () { cfg = copy(SAMPLE); sim = fresh(); draw(); toast(L('Đã điền lựa chọn mẫu – vẫn sửa được từng câu', 'Sample choices filled in – each can still be changed')); });
$('#bSave').addEventListener('click', function () { try { localStorage.setItem(KEY, JSON.stringify(cfg)); toast(L('Đã lưu bản xem thử trên trình duyệt này', 'Preview saved in this browser')); } catch (e) { toast(L('Trình duyệt này không lưu được bản thử', 'This browser cannot save the preview')); } });
$('#bReset').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) {} cfg = copy(SAMPLE); sim = fresh(); draw(); toast(L('Đã xoá bản thử', 'Preview reset')); });
document.querySelectorAll('.lang [data-lang]').forEach(function (b) { b.addEventListener('click', function () { LANG = b.dataset.lang; try { localStorage.setItem(LKEY, LANG); } catch (e) {} drawStatic(); draw(); }); });
$('#sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') e.currentTarget.hidden = true; });
window.__tr = { cfg: function () { return cfg; }, sim: function () { return sim; }, act: act, walkIn: walkIn, SVC: SVC, T: function (n) { return T(n); } };
sim = fresh(); drawStatic(); draw();
})();
</script>
