<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F1EC">
<title>Chia khách cho thợ – Xem thử</title>
<style>
:root{--bg:#F4F1EC;--card:#FFFFFF;--ink:#1B1F24;--muted:#4A5260;--line:#DDD8CF;--soft:#F7F5F1;
--acc:#0E5F8A;--accSoft:#E3F0F7;--pos:#1D5FD1;--posSoft:#E4EDFC;--cnt:#16794A;--cntSoft:#E2F4EA;--time:#8A4B08;--timeSoft:#FBEEDD;
--warn:#8A3B12;--warnSoft:#FFF1E2;--warnLine:#F2C79A;--red:#B42318;--chk:#0E5F8A;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1C1F24;--ink:#ECEEF1;--muted:#B4BAC4;--line:#343A44;--soft:#23272E;
--acc:#7CC4EA;--accSoft:#1B3442;--pos:#8DB4FF;--posSoft:#1D2C47;--cnt:#6FD39E;--cntSoft:#173527;--time:#F2B66D;--timeSoft:#3A2912;
--warn:#F6B98A;--warnSoft:#33231A;--warnLine:#6B4426;--red:#FF8A80;--chk:#7CC4EA;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
button,input,select{font:inherit;color:inherit}
.banner{position:sticky;top:0;z-index:20;background:#FFE7A8;color:#5A2A00;border-bottom:2px solid #E8B64A;text-align:center;font-weight:800;font-size:17px;line-height:1.3;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
@media (prefers-color-scheme:dark){.banner{background:#3B2C07;color:#FFD86B;border-color:#7A5A12}}
header{padding:22px 0 6px}
h1{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.lead{margin:10px 0 0;font-size:19px}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0;padding:6px;border-radius:14px;background:var(--line)}
.lang button{min-height:48px;min-width:130px;border:0;border-radius:10px;background:transparent;font-size:18px;font-weight:700;color:var(--muted);cursor:pointer;padding:0 12px}
.lang button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.howto{margin:18px 0 0;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.howto h2{margin:0 0 8px;font-size:21px}
.howto ol{margin:0;padding-left:24px}.howto li{margin:4px 0}
.legend{display:grid;gap:10px;margin:12px 0 0}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--soft)}
.lg b{display:block;font-size:19px}.lg span{display:block;color:var(--muted)}
.ico{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:12px;font-weight:800;font-size:18px;padding:0 6px}
.ico.p{background:var(--posSoft);color:var(--pos)}.ico.c{background:var(--cntSoft);color:var(--cnt)}.ico.t{background:var(--timeSoft);color:var(--time)}
nav.toc{margin:16px 0 0}
nav.toc h2{margin:0 0 8px;font-size:19px}
nav.toc .tl{display:grid;grid-template-columns:1fr;gap:8px}
nav.toc a{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
nav.toc a .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:22px 0 0;box-shadow:var(--shadow)}
.sec>h2,.sec>summary{display:flex;gap:12px;align-items:center;margin:0;padding:16px;font-size:22px;line-height:1.25;font-weight:800;border-bottom:1px solid var(--line)}
.sec>h2 .n,.sec>summary .n{flex:0 0 40px;height:40px;border-radius:50%;background:var(--acc);color:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.sec .in{padding:6px 16px 18px}
.sec .intro{margin:12px 0 0;color:var(--muted)}
.qb{margin:22px 0 0;padding-top:18px;border-top:2px dashed var(--line)}
.qb:first-of-type{border-top:0;padding-top:4px}
.q{font-weight:800;font-size:21px;line-height:1.3;margin:0 0 6px}
.q .qno{color:var(--acc);margin-right:6px}
.qn{color:var(--muted);font-size:17px;margin:0 0 10px}
.opts{display:grid;gap:10px;margin:10px 0 0}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;min-height:56px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--chk);background:var(--accSoft)}
.opt input{width:28px;height:28px;margin:2px 0 0;accent-color:var(--chk)}
.opt b{display:block;font-size:19px;line-height:1.3}
.opt .res{display:block;font-size:17px;color:var(--muted);margin-top:4px}
.opt .res::before{content:attr(data-p);font-weight:700;color:var(--ink)}
.opt.dis{opacity:.6;cursor:not-allowed}
.ex{margin:14px 0 0;padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.ex>.eh{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:var(--acc);margin:0 0 6px}
.ex>.eh::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.ex p{margin:6px 0}
.fixed{margin:14px 0 0;padding:14px;border-radius:14px;background:var(--warnSoft);border:1px solid var(--warnLine);color:var(--ink)}
.fixed b.h{display:block;color:var(--warn);font-size:18px;margin-bottom:4px}
.fixed ul{margin:6px 0 0;padding-left:22px}.fixed li{margin:4px 0}
.na{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px dashed var(--line);color:var(--muted);font-size:17px}
.now{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--cntSoft);color:var(--ink);font-size:17px;border-left:5px solid var(--cnt)}
.now b{color:var(--cnt)}
/* before / after lines */
.flow{margin:10px 0 0}
.fcap{font-size:17px;color:var(--muted);margin:4px 0}
.frow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
.flab{font-weight:800;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:17px}
.chip .cp{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--posSoft);color:var(--pos);font-weight:800}
.chip .cv{font-weight:600;color:var(--muted)}
.chip.mv{border-color:var(--pos);background:var(--posSoft)}
.chip.np{padding-left:12px}
.chip.off{opacity:.55;border-style:dashed}
.farrow{display:flex;align-items:center;gap:8px;margin:4px 0 4px 62px;font-size:17px;font-weight:700;color:var(--acc)}
.farrow::before{content:"↓";font-size:22px;line-height:1}
.cnt{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--cntSoft);font-size:17px}
.cnt .k{font-weight:800;color:var(--cnt);width:100%}
.cnt .v{font-weight:700}
.tim{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--timeSoft);font-size:17px}
.tim .k{font-weight:800;color:var(--time);width:100%}
table.tt{width:100%;border-collapse:collapse;margin:10px 0 0;font-size:17px}
.tt th,.tt td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tt td.w{font-weight:800;color:var(--cnt);white-space:nowrap}
.cards{display:grid;gap:10px;margin:12px 0 0}
.card{padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.card b.h{display:block;font-size:19px;margin-bottom:4px}
.card p{margin:6px 0}
details.more{margin:14px 0 0;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
details.more>summary{min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 14px;font-weight:700;color:var(--acc);cursor:pointer;list-style:none}
details.more>summary::-webkit-details-marker,.sec>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accSoft);font-size:22px;flex:0 0 28px}
details.more[open]>summary::before{content:"−"}
details.more>.mi{padding:0 14px 14px}
details.more .qn,details.more p,details.more li{color:var(--ink)}
details.sec.adv>summary{cursor:pointer;list-style:none;border-bottom:0}
details.sec.adv[open]>summary{border-bottom:1px solid var(--line)}
details.sec.adv>summary .chev{margin-left:auto;font-size:17px;font-weight:700;color:var(--acc);white-space:nowrap}
.num{display:flex;align-items:center;gap:10px;margin:8px 0}
.num button{flex:0 0 56px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:26px;font-weight:800;color:var(--acc);cursor:pointer}
.num output{flex:1;text-align:center;font-size:24px;font-weight:800}
.smq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.smq .money{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--acc);border-radius:12px;padding:0 10px;background:var(--card)}
.smq input{width:100px;min-height:52px;border:0;background:transparent;font-size:22px;font-weight:800;outline:none}
.steps2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.steps2 button{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:700;color:var(--acc);cursor:pointer}
.err{color:var(--red);font-weight:700;font-size:17px}.err:empty{display:none}
/* simulator */
.clock{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--accSoft)}
.clock b{display:block;font-size:21px}.clock span{display:block;font-size:17px;color:var(--muted)}
.cbtn{display:flex;flex-wrap:wrap;gap:8px}.cbtn .btn{min-height:48px;padding:6px 14px}
.bigline{margin:14px 0 0;padding:14px;border-radius:14px;border:2px solid var(--pos);background:var(--posSoft)}
.bigline .t{font-weight:800;font-size:19px;margin:0 0 8px}
.bigline .nx{margin:10px 0 0;font-weight:700}
.last{margin:14px 0 0;padding:14px;border-radius:14px;background:var(--card);border:2px solid var(--acc)}
.last .t{font-weight:800;font-size:19px;color:var(--acc)}
.last ul{margin:6px 0 0;padding-left:22px}
.queue{display:grid;gap:12px;margin:14px 0 0}
.tq{padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.tq.next{border-color:var(--cnt);box-shadow:0 0 0 3px var(--cntSoft)}
.tq .hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tq .nm{font-weight:800;font-size:22px}
.st{font-size:17px;font-weight:700;border-radius:999px;padding:2px 12px;background:var(--soft);color:var(--muted)}
.st.free{background:var(--cntSoft);color:var(--cnt)}.st.busy{background:var(--posSoft);color:var(--pos)}.st.brk,.st.away{background:var(--timeSoft);color:var(--time)}.st.pen{background:var(--warnSoft);color:var(--warn)}
.st.nx{background:var(--cnt);color:var(--card)}
.three{display:grid;gap:6px;margin:10px 0 0}
.three>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-radius:10px}
.three .p{background:var(--posSoft)}.three .c{background:var(--cntSoft)}.three .t{background:var(--timeSoft)}
.three .p b{color:var(--pos)}.three .c b{color:var(--cnt)}.three .t b{color:var(--time)}
.three b{font-size:19px;text-align:right}
.tq .stats{font-size:17px;color:var(--muted);margin-top:8px}
.tq .awayl{margin-top:8px;font-size:17px;font-weight:700;color:var(--time)}.tq .lastm{margin-top:8px;font-size:17px}
.tq .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:700;line-height:1.25;color:var(--ink);cursor:pointer;padding:8px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--card)}
.btn.grn{background:var(--cnt);border-color:var(--cnt);color:var(--card)}
.btn.red{color:var(--red)}
.btn.blk{width:100%;min-height:56px;font-size:18px}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts2 .wide{grid-column:1/-1}
.grp{font-weight:800;font-size:18px;margin:18px 0 0}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}.roles .btn{min-width:84px}
.log{margin:0;padding:0;list-style:none;max-height:420px;overflow:auto}
.log li{padding:10px 2px;border-bottom:1px solid var(--line);font-size:17px}
.log li b{display:block}
.log li small{display:block;color:var(--muted);font-size:17px}
/* review */
.sum{border:3px solid var(--cnt)}
.sum .grpS{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--soft)}
.sum .grpS h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;font-size:19px}
.sum .grpS ul{margin:8px 0 0;padding-left:22px}.sum .grpS li{margin:6px 0}
.sum .edit{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--acc);font-weight:700;font-size:17px;text-decoration:none}
.sum .sv{display:grid;gap:8px;margin:16px 0 0}
/* footer, toast, sheet */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.foot .fi{max-width:680px;margin:0 auto;display:grid;grid-template-columns:3fr 2fr;gap:8px}
.foot .btn{min-height:54px;font-size:18px}
.foot small{grid-column:1/-1;text-align:center;color:var(--warn);font-weight:700;font-size:17px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#111827;color:#fff;font-weight:700;padding:14px 20px;border-radius:16px;font-size:18px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;width:max-content;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet .box{background:var(--card);width:100%;max-width:680px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:22px}
.choices{display:grid;gap:8px;margin:12px 0}
.must{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--warnSoft);border:1px solid var(--warnLine);font-size:17px}
.fl{display:block;font-weight:700;margin:12px 0 6px}
.fi2{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:18px;background:var(--card);color:var(--ink)}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip2{min-height:48px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:17px;padding:4px 16px;cursor:pointer}
.conf{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--accSoft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0 0;font-size:17px}.kv dt{font-weight:700;color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.reps{display:grid;gap:10px;margin:8px 0 0}.rep{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.rep>b{display:block;font-size:18px}.rep .btn{margin-top:10px}
.adjl{margin:8px 0 0;padding-left:20px;font-size:17px}
.radio2{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0}.radio2 label{display:flex;align-items:center;gap:10px;min-height:48px;font-size:18px}.radio2 input{width:26px;height:26px;accent-color:var(--chk)}
[hidden]{display:none!important}
.rep.old{opacity:.75;border-style:dashed}.mid{display:block;margin-top:8px;color:var(--muted);font-size:17px}
.skr{padding:10px 0;border-bottom:1px solid var(--line)}.skr b{display:block;font-size:19px}.skr .sl{display:flex;flex-wrap:wrap;gap:8px 16px}.skr label{display:inline-flex;align-items:center;gap:10px;min-height:48px;font-size:18px;margin:4px 16px 4px 0}.skr input{width:26px;height:26px;accent-color:var(--chk)}
.steps{margin:8px 0;padding-left:24px;font-size:17px}.steps li.done{color:var(--cnt)}
.tpage h3{margin:14px 0 6px;font-size:21px}
.tpage .q{font-size:19px;margin-top:16px}
.sp{height:16px}
</style>
</head>
<body>
<div class="banner" id="banner" role="status"></div>
<div class="wrap">
<header>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <div class="lang" role="group" aria-label="Language / Ngôn ngữ"><button type="button" data-lang="vi">Tiếng Việt</button><button type="button" data-lang="en">English</button></div>
</header>
<section class="howto" id="howto"></section>
<nav class="toc" id="toc"></nav>
<div id="parts"></div>
<section class="sec" id="try"><h2 id="tryT"></h2><div class="in" id="tryBody"></div></section>
<section class="sec sum" id="review"><h2 id="sumT"></h2><div class="in" id="sum"></div></section>
<div class="sp"></div>
</div>
<div class="foot"><div class="fi">
  <button type="button" class="btn grn" id="bSave"></button>
  <button type="button" class="btn" id="bReset"></button>
  <small id="saveNote"></small>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox" role="dialog" aria-modal="true"></div></div>
<script>
(function () {
'use strict';
/* NailFlowApp – turn rules preview v7. Preview only: no network, no server, browser storage only. */
var KEY = 'nf_turn_rules_preview_v3', LKEY = 'nf_turn_rules_preview_lang';
var LANG = 'vi'; try { if (localStorage.getItem(LKEY) === 'en') LANG = 'en'; } catch (e) {}
function L(vi, en) { return LANG === 'en' ? en : vi; }
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function fmt(n) { n = Math.round(n * 10) / 10; return LANG === 'vi' ? String(n).replace('.', ',') : String(n); }
function toast(t) { var x = $('#toast'); x.textContent = t; x.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(function () { x.classList.remove('show'); }, 2400); }

var TECHS = ['Anna', 'Jenny', 'Lisa', 'Kim'];
var SVC = [
  { id: 'mani', vi: 'Làm tay', en: 'Manicure', price: 25, min: 30, parts: ['mani'] },
  { id: 'pedi', vi: 'Làm chân', en: 'Pedicure', price: 40, min: 45, parts: ['pedi'] },
  { id: 'full', vi: 'Đắp bột bộ mới', en: 'Full set (acrylic)', price: 55, min: 60, parts: ['full'] },
  { id: 'combo', vi: 'Tay + chân (1 thợ làm)', en: 'Manicure + pedicure (one tech)', price: 65, min: 75, combo: true, parts: ['mani', 'pedi'] },
  { id: 'polish', vi: 'Sơn lại', en: 'Polish change', price: 15, min: 15, parts: ['polish'] },
  { id: 'repair', vi: 'Sửa 1 móng (có tính tiền)', en: 'Fix one nail (paid)', price: 10, min: 15, parts: ['repair'] }

      L('“Xuống cuối hàng” chỉ đổi chỗ, không tăng số lượt đã tính.', '“End of the line” only changes the place; turns counted do not go up.'),
      L('Lượt phạt ghi riêng, không phải khách đã làm, không gộp với nửa lượt đang chờ.', 'Penalty turns are kept separately, are not customers served, and are never mixed with a waiting half turn.'),
      L('Lượt phạt không tạo ra tiền, tip, hoa hồng hay tiền công.', 'Penalty turns never create money, tips, commission or pay.'),
      L('Mỗi lần ra ngoài phạt tối đa một lần; không phạt tăng dần theo giờ.', 'At most one penalty per time out; it never grows hour by hour.'),
      L('Tính bằng thời gian thật từ lúc ra tới lúc vào, không làm tròn. Về sớm hoặc đúng giờ: không phạt.', 'Real time from leaving to coming back, never rounded. Back early or exactly on time: no penalty.'),
      L('Hết giờ máy không tự bấm vào; thợ phải bấm “Quay lại”.', 'The system never clocks a tech back in by itself; she must tap “Back”.'),
      L('Chủ tiệm đổi luật lúc thợ đang ra ngoài: lần ra ngoài đó vẫn theo luật lúc thợ bấm ra.', 'If the owner changes these rules while a tech is out, that time out keeps the rule from when she left.'),
      L('Trong lúc vắng: không mời khách cho thợ, không tính từ chối; lượt, nửa lượt đang chờ, tiền, tip và thứ tự so với thợ khác giữ nguyên (không đưa lên đầu hàng).', 'While away: she is never offered customers and it is not a refusal; turns, a waiting half turn, money, tips and her order versus the others stay as they were (she is not moved to the front).'),
      L('Lúc quay lại: không áp dụng luật vào ca trễ, không xóa lượt hay tiền.', 'Coming back: the late-start rule is not used; turns and money are not reset.')])
    + '<p><b>' + esc(L('Các bước trên iPad ở quầy:', 'Steps on the front desk iPad:')) + '</b></p>' + ul([
      L('Ra ngoài: thợ nhập mã PIN → chọn “Ra ngoài có việc” → ghi lý do (bắt buộc) → xem lại → bấm “Ra ngoài”. Không cần chủ duyệt trước; chủ tiệm nhận tin báo.', 'Stepping out: the tech enters her PIN → picks “Step out” → types a reason (required) → checks the details → taps “Step out”. No owner approval needed; the owner gets a message.'),
      L('Thợ còn đang làm khách phải làm xong hoặc giao lại (có ghi) trước; máy không tự kết thúc dịch vụ, thu tiền hay chuyển khách.', 'A tech still serving a customer must finish or hand over (recorded) first; the system never ends a service, takes payment or moves a customer by itself.'),
      L('Quay lại: nhập mã PIN → bấm “Quay lại”. Máy tính thời gian vắng thật, báo chủ tiệm, mở đoạn chấm công kế tiếp trong cùng ngày.', 'Coming back: enter the PIN → tap “Back”. The system measures the real time away, tells the owner and opens the next time-clock part of the same day.'),
      L('Chỉ bấm trên iPad ở quầy đã được chủ tiệm đăng ký, bằng mã PIN riêng; không bấm từ điện thoại riêng. Khi dùng thật, máy chủ kiểm tra thiết bị và quyền cho từng lần bấm, dùng giờ của máy chủ. Mã PIN không hiện trong lịch sử hay báo cáo. Bản xem thử chỉ giả lập iPad và dùng đồng hồ thử.', 'Only on a front desk iPad the owner registered, with the tech’s own PIN; never from a personal phone. When live, the server checks the device and the tech’s rights every time and uses server time. The PIN never shows in history or reports. This preview only pretends to be the iPad and uses a test clock.'),
      L('Chủ tiệm được bấm thay khi thợ quên, sửa giờ ghi sai, bỏ hoặc sửa lượt phạt, sửa chỗ trong hàng. Mỗi lần sửa ghi người sửa, lúc nào, trước/sau và lý do (bắt buộc). Lịch sử gốc không bị xóa. Thợ không tự sửa được. Thời gian vắng ghi riêng; cách tính lương hiện có không đổi.', 'The owner may tap for a tech who forgot, fix wrong times, waive or change penalty turns and fix places. Every change records who, when, before/after and a reason (required). The original history is never deleted. Techs cannot change these. Time away is kept separately; the current pay rules do not change.')]));
  h += qb(L('Nếu quay lại trễ hơn thời gian đó thì sao?', 'If she comes back later than that, what happens?'), '', body);
  return h;
}

/* ---------- 4. tech turns a customer down ---------- */
function s4() {
  sq(4); var b = '';
  if (isManual()) b += na(L('Chủ tiệm tự chọn thợ nên máy không tự mời thợ, không có từ chối tự động.', 'The owner picks, so the system never offers customers and there is no automatic refusal.'));
  else {
    var ln = isLine();
    var qh = opts(opt('refuse', 'keep', L('Giữ chỗ cũ, không phạt', 'Keeps her place, no penalty'), ln ? L('Khách đi cho thợ kế tiếp. Thợ từ chối vẫn đứng chỗ cũ và được mời khách sau.', 'The customer goes to the next tech. The tech who said no stays where she was and is offered the next one.') : L('Khách đi cho thợ kế tiếp. Thợ từ chối vẫn được so sánh như thường.', 'The customer goes to the next tech. The tech who said no is compared as usual.'))
        + opt('refuse', 'end', ln ? L('Xuống cuối hàng', 'Goes to the end of the line') : L('Đứng sau các thợ khác', 'Stands after the others'), ln ? L('Số lượt đã tính không đổi, chỉ đổi chỗ: các thợ khác được mời trước.', 'Turns counted do not change, only the place: the others are offered first.') : L('Đứng sau các thợ khác cho tới khi nhận khách kế tiếp.', 'She stands after the others until she takes a customer.'))
        + (ln ? opt('refuse', 'count', L('Tính 1 lượt như đã làm khách, và xuống cuối hàng', 'Counts 1 turn as if served, and goes to the end'), L('Số lượt đã tính cộng 1 dù không làm khách.', 'Turns counted go up by 1 even though she served no one.')) : ''));
    if (!ln && cfg.refuse === 'count') qh += na(L('Lựa chọn đang lưu (“tính 1 lượt”) chỉ dùng được khi chia theo hàng. Bản thử coi như “giữ chỗ cũ”.', 'The saved choice (“counts 1 turn”) only works with taking turns in line. The preview treats it as “keeps her place”.'));
    if (ln) {
      var aft = cfg.refuse === 'keep' ? ['Anna', 'Lisa', 'Kim', 'Jenny'] : ['Lisa', 'Kim', 'Anna', 'Jenny'];
      qh += exBox(p(L('Khách mới làm tay. Anna đứng số 1 nhưng nói không nhận. Jenny (số 2) nhận khách.', 'A new manicure customer. Anna is no. 1 but says no. Jenny (no. 2) takes the customer.'))
        + flow({ b: BASE, ev: L('Anna từ chối, Jenny nhận khách', 'Anna says no, Jenny takes the customer'), a: aft, c: [['Anna', 0, cfg.refuse === 'count' ? 1 : 0], ['Jenny', 0, 1]] })
        + p(cfg.refuse === 'keep' ? L('Anna vẫn số 1. Jenny vừa làm 1 lượt nên xuống cuối.', 'Anna is still no. 1. Jenny just did a full turn, so she goes to the end.') : cfg.refuse === 'end' ? L('Lisa và Kim được mời trước Anna. Jenny vừa làm 1 lượt nên đứng cuối.', 'Lisa and Kim are offered before Anna. Jenny just did a full turn, so she is last.') : L('Anna bị tính thêm 1 lượt và đứng sau Lisa, Kim.', 'Anna gets 1 extra turn and stands after Lisa and Kim.')));
    } else qh += exBox(p(L('Anna được mời nhưng nói không nhận; khách đi cho thợ kế tiếp. ', 'Anna is offered the customer but says no; it goes to the next tech. ') + (cfg.refuse === 'end' ? L('Anna đứng sau các thợ khác cho tới khi nhận khách kế tiếp.', 'Anna stands after the others until she takes a customer.') : L('Anna vẫn được so sánh như thường cho khách sau.', 'Anna is still compared as usual for the next customer.'))));
    b += qb(L('Thợ đang rảnh, làm được dịch vụ, nhưng không muốn nhận khách. Tiệm làm sao?', 'A free tech who can do the service does not want the customer. What happens?'), '', qh);
    if (isReady()) b += na(L('Phần 8 đang chọn “ai làm xong trước thì nhận trước”: giữ chỗ = giữ chỗ trong hàng chờ; xuống cuối = vào cuối hàng chờ.', 'Part 8 is set to “whoever finishes first goes first”: keep = keeps her place in the waiting line; end = joins the end of it.'));
    b += fixed(L('Những trường hợp KHÔNG phải từ chối', 'These are NOT refusals'), [L('Thợ đang làm khách', 'The tech is serving a customer'), L('Thợ chưa vào ca, đang nghỉ giải lao hoặc đang ra ngoài', 'The tech is not on shift yet, on a break or stepped out'), L('Thợ không làm được dịch vụ đó (xem danh sách ở Phần 8)', 'The tech cannot do that service (see the list in Part 8)'), L('Thợ cần giữ thời gian cho khách hẹn', 'The tech must keep time free for an appointment')]);
  }
  return sec(4, L('Thợ từ chối khách', 'Tech turns a customer down'), '', b);
}

/* ---------- 5. several services ---------- */
function s5() {
  sq(5); var b = '', ut = usesTurns(), ln = isLine() && !isReady();
  var cw = cfg.combo === 'each' ? 2 : 1, tw = cfg.twoTech === 'one' ? 1 : 0.5;
  var mEx = p(L('Anna chỉ làm chân, không đắp bột. Jenny làm được cả hai. Hàng: Anna, Jenny, Lisa, Kim. Khách muốn làm chân + đắp bột.', 'Anna does pedicures but not acrylic. Jenny can do both. Line: Anna, Jenny, Lisa, Kim. The customer wants a pedicure + acrylic.'));
  var oneFlow = flow({ b: BASE, ev: L('Jenny làm hết (Anna được bỏ qua vì không làm đắp bột)', 'Jenny does everything (Anna is skipped – she does not do acrylic)'), a: ln && ut ? moveTo(BASE, 'Jenny', 'end') : BASE, c: ut ? [['Anna', 0, 0], ['Jenny', 0, cw]] : null });
  var spFlow = flow({ b: BASE, ev: L('Khách đồng ý: Anna làm chân, Jenny đắp bột', 'The customer agrees: Anna does the pedicure, Jenny the acrylic'), a: ln && ut ? (tw >= 1 ? ['Lisa', 'Kim', 'Anna', 'Jenny'] : BASE) : BASE, c: ut ? [['Anna', 0, tw], ['Jenny', 0, tw]] : null });
  mEx += cfg.multi === 'one' ? oneFlow + p(L('Anna không mất chỗ, không bị phạt.', 'Anna keeps her place and has no penalty.')) : cfg.multi === 'split' ? p(L('Quầy hỏi khách trước. Nếu khách đồng ý chia:', 'The desk asks the customer first. If she agrees to share:')) + spFlow + p(L('Nếu khách muốn 1 thợ: Jenny làm hết.', 'If she wants one tech: Jenny does everything.')) : p(L('Quầy hỏi khách: muốn 1 thợ thì Jenny làm hết; đồng ý chia thì Anna làm chân, Jenny đắp bột.', 'The desk asks: one tech → Jenny does everything; sharing → Anna does the pedicure, Jenny the acrylic.')) + oneFlow;
  b += qb(L('Khách muốn làm nhiều dịch vụ (ví dụ làm chân + đắp bột). Chia thế nào?', 'A customer wants several services (e.g. pedicure + acrylic). How is it shared?'), '',
    opts(opt('multi', 'one', L('Ưu tiên 1 thợ làm hết', 'Prefer one tech for everything'), L('Chỉ đưa cho thợ làm được tất cả dịch vụ khách cần.', 'Only a tech who can do all the services is chosen.'))
      + opt('multi', 'split', L('Ưu tiên chia cho nhiều thợ, nếu khách đồng ý', 'Prefer sharing among techs, if the customer agrees'), L('Hỏi khách trước. Khách không đồng ý thì 1 thợ làm hết.', 'Ask the customer first. If she says no, one tech does everything.'))
      + opt('multi', 'ask', L('Người ở quầy hỏi khách rồi quyết định', 'The front desk asks the customer each time'), L('Mỗi lần có khách như vậy, quầy hỏi khách muốn 1 thợ hay nhiều thợ.', 'Each time, the desk asks if she wants one tech or several.')))
    + exBox(mEx) + fixed(L('Luật cố định', 'Fixed rule'), [L('Không bao giờ tự chia khách cho nhiều thợ hoặc đổi thợ khách đã gọi tên khi khách chưa đồng ý.', 'A customer is never split among techs, and a requested tech is never changed, without the customer’s OK.'), L('Thợ không làm được dịch vụ thì được bỏ qua: không phải từ chối, không mất chỗ, không tính lượt, không phạt; nửa lượt đang chờ vẫn giữ.', 'A tech who cannot do a service is skipped: not a refusal, no lost place, no turn, no penalty; a waiting half turn stays.'), L('Nhiều thợ làm được hết: chọn theo cách chia ở Phần 1, không ưu tiên ai sẵn.', 'If several techs can do everything, Part 1 decides; nobody is preferred by default.')]));
  if (ut) {
    b += qb(L('Một thợ làm cả tay và chân cho cùng một khách. Tính mấy lượt?', 'One tech does both hands and feet for the same customer. How many turns?'), '',
      opts(opt('combo', 'one', L('Tổng cộng 1 lượt', 'One turn in total'), L('Cả khách chỉ tính 1 lượt.', 'The whole customer counts as 1 turn.'))
        + opt('combo', 'each', L('Mỗi dịch vụ 1 lượt (tay + chân = 2 lượt)', 'One turn per service (hands + feet = 2 turns)'), L('Số lượt đã tính cộng 2.', 'Turns counted go up by 2.')))
      + exBox(flow({ b: BASE, ev: L('Anna làm tay + chân cho 1 khách', 'Anna does hands + feet for one customer'), a: ln ? moveTo(BASE, 'Anna', 'end') : BASE, c: [['Anna', 0, cw]] })));
    b += qb(L('Hai thợ cùng làm một khách (một người làm chân, một người làm tay). Mỗi thợ tính mấy lượt?', 'Two techs share one customer (one does feet, one does hands). How many turns each?'), L('Một thợ làm cả hai thì xem câu ngay trên.', 'One tech doing both: see the question above.'),
      opts(opt('twoTech', 'one', L('Mỗi thợ 1 lượt', 'One turn each'), L('Cả hai thợ cộng 1 lượt' + (ln ? ' và xuống cuối hàng.' : '.'), 'Both techs add 1 turn' + (ln ? ' and go to the end of the line.' : '.')))
        + opt('twoTech', 'half', L('Mỗi thợ nửa lượt (0,5)', 'Half a turn each (0.5)'), L('Mỗi thợ cộng 0,5. Lần nửa lượt đầu giữ chỗ; đủ 2 lần nửa lượt thì xuống cuối hàng.', 'Each adds 0.5. The first half keeps her place; after two halves she goes to the end of the line.')))
      + exBox(flow({ b: BASE, ev: L('Anna làm chân, Jenny làm tay cho cùng 1 khách', 'Anna does feet, Jenny does hands for one customer'), a: ln ? (tw >= 1 ? ['Lisa', 'Kim', 'Anna', 'Jenny'] : BASE) : BASE, c: [['Anna', 0, tw], ['Jenny', 0, tw]] }) + (tw < 1 && ln ? p(L('Đây là nửa lượt đầu của Anna và Jenny nên cả hai giữ chỗ. Lần nửa lượt kế tiếp sẽ đưa họ xuống cuối hàng.', 'This is Anna’s and Jenny’s first half, so both keep their place. Their next half turn sends them to the end of the line.')) : '')));
  }
  if (ut || cfg.method === 'points') {
    var su = money2(cfg.smallUnder), lo = money2(Math.max(0.01, Math.round((+cfg.smallUnder - 5) * 100) / 100));
    var tH = esc(L('Dịch vụ nhỏ: giá dưới ', 'Small service: priced under ')) + '<span class="smq" style="display:inline-flex;margin:0"><span class="money"><span>$</span><input id="smallIn" type="text" inputmode="decimal" autocomplete="off" value="' + esc(su) + '" aria-label="' + esc(L('Mức tiền dịch vụ nhỏ', 'Small service amount')) + '"></span></span> ' + esc(L('thì tính thế nào?', '– how does it count?'));
    var body = '<div class="steps2"><button type="button" data-dn="smallUnder" data-step="-5" data-min="0.01" data-max="9999" aria-label="' + esc(L('Bớt $5', 'Less $5')) + '">− $5</button><button type="button" data-dn="smallUnder" data-step="5" data-min="0.01" data-max="9999" aria-label="' + esc(L('Thêm $5', 'More $5')) + '">+ $5</button></div><div class="err" id="smallErr" role="alert"></div>';
    if (ut) {
      var sw = +cfg.smallW, sa = !ln ? BASE : sw >= 1 ? moveTo(BASE, 'Anna', 'end') : BASE;
      body += opts(opt('smallW', '0', L('Không tính lượt, giữ chỗ', 'No turn, keeps her place'), L('Làm xong vẫn đứng chỗ cũ; số lượt đã tính không đổi.', 'She stays where she was; turns counted do not change.'))
        + opt('smallW', '0.5', L('Nửa lượt (0,5)', 'Half a turn (0.5)'), L('Cộng 0,5. Lần đầu giữ chỗ; đủ 2 lần nửa lượt (= 1 lượt) thì xuống cuối hàng.', 'Adds 0.5. The first time she keeps her place; after two halves (= 1 turn) she goes to the end.'))
        + opt('smallW', '1', L('Một lượt', 'One turn'), L('Tính như khách thường.', 'Counts like a normal customer.')))
        + exBox(p(L('Mức đang đặt: dưới $', 'Amount set: under $') + su + L('. Anna đứng số 1, làm 1 dịch vụ $', '. Anna is no. 1 and does a $') + lo + '.')
          + flow({ b: BASE, ev: L('Anna làm dịch vụ $', 'Anna does a $') + lo + L(' (dịch vụ nhỏ)', ' service (small)'), a: sa, c: [['Anna', 0, sw]] })
          + p(L('Khách đúng $', 'A customer at exactly $') + su + L(' hoặc cao hơn thì tính như thường.', ' or more counts as normal.')));
    } else body += na(L('Cách chia theo điểm: dịch vụ dưới mức này = nửa điểm. Hai thợ chia một khách: mỗi thợ nửa số điểm.', 'Points: a service under this amount = half a point. Two techs sharing: each gets half the points.'));
    b += qb(tH, L('Chỉ áp dụng khi giá thấp hơn số này. Đúng bằng hoặc cao hơn thì tính như thường. Không tính tip và thuế. Gõ số tiền hoặc bấm − / +.', 'Only for prices below this amount. At or above it, normal rules apply. Tip and tax are not included. Type the amount or tap − / +.'), body, true);
  }
  if (!ut) b += na(L('Cách chia đang chọn không dùng số lượt. ', 'The chosen way does not use turns. ') + (cfg.method === 'dollar' ? L('Mỗi dịch vụ cộng đúng giá của nó. Hai thợ chia một khách: mỗi thợ cộng nửa giá.', 'Each service adds its own price. Two techs sharing: each adds half the price.') : cfg.method === 'count' ? L('Mỗi khách đếm là 1, dù làm mấy dịch vụ. Hai thợ chia một khách: mỗi thợ đếm 1 khách.', 'Each customer counts 1, however many services. Two techs sharing: each counts 1 customer.') : cfg.method === 'time' ? L('Cộng số phút thật của dịch vụ. Hai thợ chia một khách: mỗi thợ cộng phút mình làm.', 'Adds the real minutes. Two techs sharing: each adds her own minutes.') : L('Hai thợ chia một khách: mỗi thợ nửa số điểm.', 'Two techs sharing: each gets half the points.')));
  if (isReady() && ut) b += na(L('Phần 8 đang chọn “ai làm xong trước thì nhận trước”: nửa lượt và “không tính lượt” vẫn được ghi để xem, nhưng không giữ được chỗ cũ.', 'Part 8 is set to “whoever finishes first goes first”: half turns and “no turn” are still recorded, but do not keep the old place.'));
  return sec(5, L('Khách làm nhiều dịch vụ', 'Customer with several services'), L('Một thợ hay nhiều thợ, hai thợ làm chung một khách, và dịch vụ nhỏ.', 'One tech or several, two techs on one customer, and small services.'), b);
}

/* ---------- 6. when a turn counts ---------- */
function s6() {
  sq(6); var b = '', ut = usesTurns(), o = tm(+cfg.openTime);
  if (ut) {
    var rows = [[L('Khách thường (không hẹn, hoặc có hẹn mà không gọi tên)', 'Normal customer (no booking, or booked without asking for a tech)'), '1'],
      [L('Khách gọi đúng tên thợ', 'Customer asked for the tech by name'), fmt(+cfg.reqW)],
      [L('Dịch vụ nhỏ dưới $', 'Small service under $') + money2(cfg.smallUnder), fmt(+cfg.smallW)],
      [L('Một thợ làm cả tay và chân', 'One tech does hands and feet'), cfg.combo === 'each' ? '2' : '1'],

  var dn = e.target.closest('[data-done]'); if (dn) { doneSheet(dn.dataset.done); return; }
  var ph = e.target.closest('[data-ph]'); if (ph) { setPhase(ph.dataset.ph); draw(); return; }
  var py = e.target.closest('[data-pay]'); if (py) { payNow(py.dataset.pay); draw(); return; }
  var ro = e.target.closest('[data-role]'); if (ro) { ROLE = ro.dataset.role; draw(); return; }
  var rp = e.target.closest('[data-rep]'); if (rp) { repSheet(+rp.dataset.rep, null); return; }
  var mi = e.target.closest('[data-mis]'); if (mi) { repSheet(null, +mi.dataset.mis); return; }
  var hr = e.target.closest('[data-hr]'); if (hr) { hrSheet(+hr.dataset.hr); return; }
  var re = e.target.closest('[data-re]'); if (re) { reSheet(+re.dataset.re); return; }
  var bk = e.target.closest('[data-brk]'); if (bk) { var t2 = T(bk.dataset.brk); t2.brk = !t2.brk; if (t2.brk) t2.brkAt = sim.now; var before = lineStr(); if (!t2.brk && cfg.breakBack === 'end') { if (isLine()) toEnd(t2); else t2.pen = true; } if (!t2.brk && isReady() && sim.line.indexOf(t2.name) < 0) toEnd(t2); if (!t2.brk && isReady()) t2.readyAt = sim.now;
    sim.log.unshift({ b: tm(sim.now) + ' · ' + t2.name + (t2.brk ? L(' đi nghỉ giải lao', ' takes a break') : L(' nghỉ xong quay lại', ' is back from the break')), m: t2.brk ? L('không được giao khách khi đang nghỉ; chỗ trong hàng giữ nguyên', 'gets no customers while on break; place kept') : (cfg.breakBack === 'keep' ? L('giữ chỗ', 'keeps her place') : L('xuống cuối hàng', 'goes to the end')) + (isLine() ? ' · ' + L('trước: ', 'before: ') + before + L(' · sau: ', ' · after: ') + lineStr() : '') }); draw(); return; }
  var ck = e.target.closest('[data-clk]'); if (ck) { if (ck.dataset.clk === 'open') advance(Math.max(0, +cfg.openTime - sim.now)); else advance(+ck.dataset.clk); return; }
  var ci = e.target.closest('[data-in]'); if (ci) { var t3 = T(ci.dataset.in); t3.on = true; t3.clockIn = sim.now; sim.line.push(t3.name);
    if (!isLine() && !isManual() && cfg.late === 'avg') { var others = sim.t.filter(function (x) { return x !== t3 && x.on; }); var av = function (f) { return others.reduce(function (s, x) { return s + x[f]; }, 0) / Math.max(1, others.length); }; t3.money = av('money'); t3.cust = Math.round(av('cust')); t3.min = Math.round(av('min')); t3.pts = av('pts'); }
    sim.log.unshift({ b: tm(sim.now) + ' · ' + t3.name + L(' bấm vào ca', ' starts the shift') + ' (' + onShift() + L(' thợ trong ca)', ' on shift)'), m: isLine() ? L('đứng cuối hàng hiện tại · hàng: ', 'joins the end of the line · line: ') + lineStr() : (cfg.late === 'avg' ? L('bắt đầu bằng mức trung bình', 'starts at the average') : L('bắt đầu từ 0', 'starts from 0')) }); draw(); return; }
});
$('#bSave').addEventListener('click', save);
$('#bReset').addEventListener('click', function () { if (!window.confirm(L('Xoá các lựa chọn đã lưu và trở về lựa chọn mẫu?', 'Clear the saved choices and go back to the sample choices?'))) return; try { localStorage.removeItem(KEY); } catch (e) {} cfg = copy(SAMPLE); sim = fresh(); draw(); toast(L('Đã xoá – trở về lựa chọn mẫu', 'Cleared – back to the sample choices')); });
document.querySelectorAll('.lang [data-lang]').forEach(function (b) { b.addEventListener('click', function () { if (LANG === b.dataset.lang) return; LANG = b.dataset.lang; try { localStorage.setItem(LKEY, LANG); } catch (e) {} if (sim && sim.log.length) { sim = fresh(sim.mode); ROLE = 'owner'; toast(L('Đã đổi ngôn ngữ – bắt đầu ngày thử mới', 'Language changed – a new test day started')); } drawStatic(); draw(); }); });
$('#sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') e.currentTarget.hidden = true; });
window.__tr = { cfg: function () { return cfg; }, sim: function () { return sim; }, act: act, walkIn: walkIn, advance: advance, SVC: SVC, goOut: goOut, comeBack: comeBack, finish: function (n) { var t = T(n); if (!t || !t.busy) return serviceDone(n, 'tech', 'ready'); t.phase = 'left'; var r = serviceDone(n, 'tech', 'ready'); draw(); return r; }, serviceDone: serviceDone, setPhase: setPhase, multiAssign: multiAssign, reassign: reassign, reportIssue: reportIssue, handleReport: handleReport, giveTo: giveTo, role: function (r) { ROLE = r; draw(); }, decs: function () { return sim.decs; }, draw: function () { draw(); }, endShift: endShift, endDay: endDay, ownerAdj: ownerAdj, snapNow: snapNow, evById: function (i) { return evById(i); }, T: function (n) { return T(n); } };
sim = fresh(); drawStatic(); draw();
})();
