# Android test app (.apk) – GitHub → Actions → "Android APK" → Run workflow → when it is green, open it → Artifacts → NailFlow-android-apk
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Firebase file (notifications) – from the secret GOOGLE_SERVICES_JSON
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: if [ -f google-services.json ]; then echo "google-services.json from the repo (Firebase project an-salon-push)"; elif [ -n "$GSJ" ]; then printf '%s' "$GSJ" > google-services.json; else echo "No google-services.json – the app works, only without notifications"; fi
      - run: npm run add:android
      - run: npm run assets
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk NailFlow-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: NailFlow-android-apk, path: NailFlow-test.apk }
